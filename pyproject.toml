[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tda"
version = "0.2.0"
description = "Taylor-dispersion-analysis fitting library (CRLI / Laplace / parametric / global-series models)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["tda*"]
